[package]
name = "hub"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"

[dependencies]
rinf = "8.7.2"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["rt", "macros", "time"] }
async-trait = "0.1.88"
messages = "0.3.1"
single-instance = "0.3.3"
interprocess = { version = "2.2.3", features = ["tokio"] }
bincode = "2.0.1"
anyhow = "1.0.98"
notify = "8.2.0"
futures = "0.3.31"
